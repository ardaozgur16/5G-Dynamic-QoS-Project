# =================================================================
# 5G Dinamik QoS ve Bant Genişliği Yönetimi - Politika Kuralları
# =================================================================

# 1. KARAR EŞİKLERİ (Thresholds)
# Hücre doluluk oranı (%) hangi seviyeye gelince kısıtlama başlayacak?
thresholds:
  high_load_percent: 80.0      # Hücre doluluğu %80'e ulaşırsa 'throttled' profili uygulanır.

# 2. HEDEF ABONELER (Target UEs)
# Hız kısıtlamasından etkilenecek düşük öncelikli cihazların SUPI/IMSI kimlikleri.
# Not: VIP kullanıcıları (örneğin IMSI-001) bu listeye yazmazsanız, hızları asla kesilmez!
target_ues:
  - "imsi-208930000000003"     # Örn: Standart akıllı telefon abonesi
  - "imsi-208930000000004"     # Örn: Gecikmeye duyarlı olmayan bir IoT cihazı
  - "imsi-208930000000005"     # Örn: Best-effort video streaming yapan cihaz

# 3. QoS PROFİLLERİ (Quality of Service Profiles)
# Uygulanacak 5QI sınıfları ve MBR (Maximum Bit Rate) sınırlamaları.
profiles:
  
  # Hücre yükü %80'in ALTINDA iken (Normal Durum)
  normal:
    5qi: 9                     # 5QI 9: Standart İnternet (Best Effort)
    mbr_dl: "50 Mbps"          # Maksimum İndirme Hızı
    mbr_ul: "20 Mbps"          # Maksimum Yükleme Hızı

  # Hücre yükü %80'in ÜZERİNDE iken (Tıkanıklık Durumu - Congestion)
  throttled:
    5qi: 9
    mbr_dl: "2 Mbps"           # Ağ rahatlayana kadar indirme hızı sert şekilde kısıtlanır.
    mbr_ul: "1 Mbps"           # Ağ rahatlayana kadar yükleme hızı kısıtlanır.

  # (Opsiyonel Ekstra Profil) İleride kodu geliştirip %95 üzeri için ekleyebilirsiniz
  critical_throttled:
    5qi: 9
    mbr_dl: "512 Kbps"
    mbr_ul: "256 Kbps"